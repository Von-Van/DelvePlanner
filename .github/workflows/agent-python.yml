name: Agent Python CI

on:
  push:
    branches: [main, delveops-overhaul]
    paths:
      - "agent-python/**"
      - ".github/workflows/agent-python.yml"
  pull_request:
    paths:
      - "agent-python/**"
      - ".github/workflows/agent-python.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: agent-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
