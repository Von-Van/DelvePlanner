[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delveagent"
version = "0.1.0"
description = "DelveAgent local agent runtime: agent architectures, local model client, tool clients"
requires-python = ">=3.11"
# Standard library only at runtime: no agent frameworks, no HTTP libraries.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
delveagent = "delveagent.cli:main"

[tool.setuptools.packages.find]
include = ["delveagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
