[package]
name = "delve-planner-desktop"
version = "0.4.0"
description = "A local-first AI day planner"
authors = ["Delve Planner"]
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "delve_planner_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "delve-planner-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calcard = { version = "0.3.14", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
iana-time-zone = "0.1"
keyring-core = "1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# Signals the whole server process group, so Ollama's model runners stop with it.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
